name: Claude Code

# "@claude" in a comment, a review or an issue starts Claude on this
# repository, for work on dev and nothing else:
#
# - on a pull request, only one into dev; the release pull request into main
#   is never worked on;
# - on an issue, the branch it makes starts from dev and its pull request goes
#   into dev (`base_branch`).
#
# Who may ask is the action's check: somebody with write access to the
# repository. Bots and users without it are refused by default.
#
# GitHub runs the workflow of a comment, a review or an issue from the default
# branch, and the action refuses to run unless this file there is identical to
# the one it runs, so a change here takes effect once it has reached main.
#
# Actions are pinned to a commit, not to a tag; `.github/dependabot.yml` says
# why, and is what moves the pins.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  # Which branch a comment on a pull request is about is not in the event, so
  # it is asked; a review or a review comment carries it. An issue, or a
  # comment on one, is work that starts from dev.
  target:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      dev: ${{ steps.base.outputs.dev }}
    steps:
      - name: The branch the work is for
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          ON_A_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          case "$EVENT" in
            pull_request_review|pull_request_review_comment)
              base="$PR_BASE" ;;
            issue_comment)
              if [ "$ON_A_PR" = true ]; then
                base=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .base.ref)
              else
                base=dev
              fi ;;
            *)
              base=dev ;;
          esac
          echo "base: $base"
          if [ "$base" = dev ]; then
            echo "dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "dev=false" >> "$GITHUB_OUTPUT"
          fi

  claude:
    needs: target
    if: needs.target.outputs.dev == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      # To read CI results on a pull request.
      actions: read
    steps:
      # dev, not the default branch: an issue's work starts from it, and on a
      # pull request the action moves to the pull request's own branch.
      # No credentials left behind: the action replaces them with its own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: dev
          additional_permissions: |
            actions: read
