name: Claude Code

# "@claude" in a comment, a review or an issue starts Claude on this
# repository:
#
# - on a pull request, any pull request, whatever branch it goes into; the
#   action works on the pull request's own branch;
# - on an issue, the branch it makes starts from dev and its pull request goes
#   into dev (`base_branch`).
#
# The review of every pull request into main, and of one labeled
# `claude-review`, is claude-code-review.yml, not this.
#
# Who may ask is the action's check: somebody with write access to the
# repository. Bots and users without it are refused by default.
#
# GitHub runs the workflow of a comment, a review or an issue from the default
# branch, and the action refuses to run unless this file there is identical to
# the one it runs, so a change here takes effect once it has reached main.
#
# Actions are pinned to a commit, not to a tag; `.github/dependabot.yml` says
# why, and is what moves the pins.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      # To read CI results on a pull request.
      actions: read
    steps:
      # dev, not the default branch: an issue's work starts from it, and on a
      # pull request the action moves to the pull request's own branch.
      # No credentials left behind: the action replaces them with its own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: dev
          additional_permissions: |
            actions: read
