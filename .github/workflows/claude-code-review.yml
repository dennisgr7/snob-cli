name: Claude Code Review

# A review by Claude, posted as comments on the lines it is about, of:
#
# - every pull request into main, the release, on its own;
# - any other pull request once it carries the `claude-review` label, which
#   stands in for asking Claude as a reviewer: GitHub only lets users and teams
#   be requested, not an app. Taking the label off and putting it back asks
#   again.
#
# "@claude" in a comment on any pull request is claude.yml, not this.
#
# The review is a prompt written here rather than the `code-review` plugin: a
# plugin's marketplace can only be named by its repository's moving branch,
# which is code that changes under this workflow with no diff here, the thing
# pinning the actions to a commit exists to stop.
#
# The action refuses to run unless this file is identical on the default
# branch, so a change here takes effect once it has reached main.
#
# Actions are pinned to a commit, not to a tag; `.github/dependabot.yml` says
# why, and is what moves the pins.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]

permissions:
  contents: read

jobs:
  review:
    if: |
      github.event.pull_request.draft == false && (
        (github.event.action != 'labeled' && github.event.pull_request.base.ref == 'main') ||
        (github.event.action == 'labeled' && github.event.label.name == 'claude-review')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}

            Review this pull request. AGENTS.md is the project's instruction
            document: read its rules first, and the doc-comment above any
            code the change touches, which says what that code is for.

            Report real defects only, most severe first: a bug, a security
            problem, a request to Instagram that is not paced, paid or
            allowlisted, a write that is not one of the two, anything that
            would mark a story as seen, a test that does not test what it
            says, documentation that disagrees with the code. No style
            nitpicks, and nothing already said in an earlier comment on this
            pull request.

            Put each finding on the line it is about, with the scenario that
            triggers it. If there is nothing worth saying, say so in one
            comment on the pull request.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
