# Keeps the pinned actions and the dependency graph from rotting.
#
# The workflows pin every action to a commit, not to a tag. A tag is a movable
# ref: whoever can push to the action's repository can point `v4` at different
# code tomorrow, and every workflow that names `v4` runs it without a diff
# anywhere. That is the shape of most of the CI supply-chain incidents of the
# last two years. A branch, such as the `stable` of `dtolnay/rust-toolchain`,
# is worse still: it moves on every commit to it. The comment after each pin
# is the version it is, so a reader can see at a glance what is installed;
# this file is what moves them, and without it they rot.
#
# Since July 2026 Dependabot applies a three-day release cooldown by default,
# with nothing to configure — which is what makes this safe to switch on.
# Without it, Dependabot would be a fast follower of every fresh publish, and a
# freshly published malicious version is exactly what `--locked` and the
# advisory job exist to keep out of a build.
#
# Weekly rather than daily: this is a small tool with five targets, and a pull
# request per dependency per day is how an update feed gets muted.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # The lockfile is what ships, so an update has to be a reviewed change to
    # it rather than a manifest range widening under everybody.
    versioning-strategy: lockfile-only
  # The website's packages. pnpm's own 24-hour quarantine
  # (`web/pnpm-workspace.yaml`) holds on top of Dependabot's cooldown.
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
